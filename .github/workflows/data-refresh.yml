name: Preparar atualização oficial dos dados

on:
  workflow_dispatch:
    inputs:
      collected_date:
        description: "Data da coleta (AAAA-MM-DD). Deixe vazio para usar a data UTC atual."
        required: false
        type: string

concurrency:
  group: official-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    name: Coletar, validar e preparar revisão
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências do pipeline
        run: python -m pip install --requirement requirements.txt

      - name: Coletar e exportar pacotes oficiais
        shell: bash
        env:
          COLLECTED_DATE: ${{ inputs.collected_date }}
        run: |
          if [ -n "$COLLECTED_DATE" ]; then
            python -m pipeline.run_phase02 --collected-date "$COLLECTED_DATE"
          else
            python -m pipeline.run_phase02
          fi

      - name: Validar contratos e transformações
        run: python -m pytest pipeline/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências do site
        working-directory: app
        run: npm ci

      - name: Testar e compilar o site
        working-directory: app
        run: |
          npm test
          npm run build

      - name: Criar branch de revisão
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "## Nenhuma alteração detectada" >> "$GITHUB_STEP_SUMMARY"
            echo "As fontes retornaram os mesmos pacotes já versionados." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="automation/official-data-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add --all
          git commit -m "data: refresh official source packages"
          git push origin "$branch"

          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          echo "## Atualização pronta para revisão" >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir proposta de atualização](${compare_url})" >> "$GITHUB_STEP_SUMMARY"
          echo "A branch não altera a produção até ser revisada e integrada." >> "$GITHUB_STEP_SUMMARY"
