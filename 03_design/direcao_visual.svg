<g font-family="Arial,sans-serif"><text x="64" y="62" fill="#FFFEF9" font-size="28" font-weight="bold">fôlego.</text><text x="65" y="85" fill="#A7CCBA" font-size="11" letter-spacing="2">DÍVIDAS, RENDA E TERRITÓRIO</text>
<g fill="#FFFEF9" font-size="14"><text x="670" y="64">Panorama</text><text x="790" y="64">Cidades</text><text x="890" y="64">Evolução</text><text x="1000" y="64">Método</text></g>
<rect x="1170" y="32" width="204" height="48" rx="4" fill="#FFFEF9"/><text x="1206" y="62" fill="#103E3B" font-size="15">Buscar cidade ↗</text>
<text x="64" y="190" fill="#A7CCBA" font-family="monospace" font-size="13">CEARÁ / BRASIL · PROPOSTA DE DESIGN</text>
<g fill="#FFFEF9" font-size="82" letter-spacing="-4"><text x="60" y="286">Quanto espaço</text><text x="60" y="373">sobra no</text><text x="60" y="460">orçamento?</text></g>
<text x="65" y="510" fill="#D2E3D6" font-size="19">Uma investigação sobre dívidas, renda e território.</text><text x="65" y="542" fill="#D2E3D6" font-size="17">Explore o Ceará e descubra o que os dados permitem observar.</text>
<g fill="none" stroke="#76AD98" stroke-width="1"><circle cx="1125" cy="340" r="180"/><circle cx="1125" cy="340" r="140"/><circle cx="1125" cy="340" r="100"/><circle cx="1125" cy="340" r="60"/></g>
<path d="M950 340 H1300" stroke="#F4F1E8" stroke-width="2"/><circle cx="1170" cy="340" r="10" fill="#D2E3D6"/><text x="988" y="555" fill="#A7CCBA" font-family="monospace" font-size="11">COMPOSIÇÃO ABSTRATA · SEM CODIFICAÇÃO DE DADOS</text>
<text x="64" y="665" fill="#125C57" font-family="monospace" font-size="12">01 / EXPLORAR O TERRITÓRIO</text><text x="60" y="725" fill="#142D2C" font-size="44" letter-spacing="-1">Cada cidade tem uma história.</text>
<text x="64" y="766" fill="#4C6260" font-size="18">Uma ficha clara, com o indicador, a fonte, a data e os limites de cobertura.</text>
