<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">Fôlego — direção visual proposta</title><desc id="desc">Prancha editorial em verde petróleo e areia com hero, amostras de cores, estrutura de ficha municipal e tratamento de ausência. Sem dados analíticos.</desc>
