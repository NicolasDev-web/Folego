<line x1="94" x2="845" y1="882" y2="882" stroke="#D7DCD3"/><text x="94" y="925" fill="#142D2C" font-size="24">Mapa + lista acessível</text><text x="94" y="961" fill="#4C6260" font-size="16">A cartografia final usará a malha oficial do IBGE.</text><text x="94" y="995" fill="#4C6260" font-size="16">Somente indicadores com cobertura validada serão representados.</text>
